<!DOCTYPE html>
<html lang="ja">
<head>

<title>心に火をともす30話</title>
<style>
  :root { --ink:#1d2433; --main:#1f4e79; --accent:#b8862b; --paper:#fff; --bg:#e9edf2; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:"Yu Mincho","游明朝","Hiragino Mincho ProN","MS PMincho",serif; }
  .page { width:210mm; min-height:297mm; margin:10mm auto; padding:18mm 16mm 14mm;
    background:var(--paper); position:relative; page-break-after:always; break-after:page;
    box-shadow:0 2px 10px rgba(0,0,0,.15); display:flex; flex-direction:column; }
  .frame { flex:1; border:2.5pt solid var(--main); border-radius:0 0 14mm 14mm;
    padding:16mm 15mm 12mm; display:flex; flex-direction:column; }
  .no { font-family:"Yu Gothic","游ゴシック","Meiryo",sans-serif; color:var(--accent);
    font-weight:700; letter-spacing:.3em; text-align:center; font-size:11pt; }
  h2 { font-family:"Yu Gothic","游ゴシック","Meiryo",sans-serif; color:var(--main);
    text-align:center; font-size:21pt; margin:5mm 0 4mm; line-height:1.45; }
  .rule { width:28mm; height:2pt; background:var(--accent); margin:0 auto 11mm; }
  .story p { font-size:13.5pt; line-height:2.15; margin:0; text-indent:1em; text-align:justify; }
  .story b { font-family:"Yu Gothic","游ゴシック","Meiryo",sans-serif; font-weight:700; }
  .last { margin-top:auto; padding-top:9mm; }
  .last p { border-top:1pt solid var(--accent); padding-top:6mm; text-align:center;
    font-family:"Yu Gothic","游ゴシック","Meiryo",sans-serif; font-weight:700;
    color:var(--main); font-size:14.5pt; line-height:1.8; margin:0; }
  .page:not(.cover):not(.toc) .frame { padding-top:9mm; }
  .page:not(.cover):not(.toc) .rule { margin-bottom:7mm; }
  .ill { display:block; height:40mm; margin:0 auto 5mm; fill:none; stroke:var(--ink);
    stroke-width:2; stroke-linecap:round; stroke-linejoin:round; overflow:visible; }
  .ill .ac { stroke:var(--accent); } .ill .af { fill:var(--accent); stroke:none; }
  .ill .kf { fill:var(--ink); stroke:none; }
  .ill text { fill:var(--accent); stroke:none; font-family:"Yu Gothic","Meiryo",sans-serif; font-weight:700; }
  .pn { text-align:center; font-family:sans-serif; font-size:10pt; margin-top:6mm; color:#555; }
  .cover .frame { justify-content:center; align-items:center; text-align:center; }
  .cover h1 { font-family:"Yu Gothic","游ゴシック","Meiryo",sans-serif; color:var(--main);
    font-size:38pt; margin:0 0 8mm; letter-spacing:.08em; line-height:1.4; }
  .cover .sub { font-size:15pt; line-height:2; }
  .toc ol { columns:2; column-gap:12mm; font-size:11.5pt; line-height:2.05; padding-left:2em; margin:0; }
  .toc h2 { margin-bottom:8mm; }
  @media print { body { background:#fff; } .page { margin:0; box-shadow:none; } }
  @page { size:A4; margin:0; }
  @media (max-width:800px) { .page { width:auto; min-height:0; margin:12px; padding:20px 16px; }
    .frame { padding:24px 18px; } .toc ol { columns:1; } .cover h1 { font-size:28pt; } }
</style>
</head>
<body>
<div id="book"></div>
<script>
const S = [
{t:"灯台は、船を追いかけない",
 p:["岬の灯台は、一度も海へ出たことがありません。嵐の夜も、凪の夜も、同じ場所に立ち、同じ光を放ち続けています。",
    "もし灯台が、困っている船を見つけるたびに、あちらこちらへ走り回ったとしたら、どうなるでしょうか。船は、どこを目印にすればよいのか分からなくなってしまいます。",
    "灯台が頼りにされるのは、**立つ場所を決めている**からです。そして、**光を出し惜しみしない**からです。",
    "あなたは、あれもこれもと走り回って、自分の立つ場所を見失ってはいませんか。"],
 e:"立つ場所を決めなさい。そこで、あなたの光を放つのです。"},
{t:"雨の日の傘屋",
 p:["ある商店街に、傘屋が二軒並んでいました。",
    "一軒目の主人は、晴れた日には「今日も売れない」と空をにらみ、雨の日には「仕入れが足りない」と嘆いていました。",
    "二軒目の主人は、晴れた日には日傘を店先に並べ、修理の看板を出し、雨の日には駅まで出かけて行って傘を売りました。",
    "同じ通り、同じ空、同じ商品です。違っていたのは、**天気ではなく、天気の受けとめ方**でした。",
    "天気は、あなたには変えられません。しかし、**今日、店先に何を並べるか**は、あなたが決められるのです。"],
 e:"空をにらむのをやめて、店先に目を向けましょう。"},
{t:"蛇口から最初に出る水",
 p:["長い間使っていなかった水道の蛇口をひねると、最初は赤く濁った水が出てきます。",
    "そこで「この水道は駄目だ」と蛇口を閉めてしまう人は、いつまでたっても澄んだ水を飲むことができません。**水を澄ませる方法は、流し続けること**だけだからです。",
    "新しい仕事、新しい習慣、新しい挑戦。どれも最初に出てくる成果は、たいてい濁っています。それは才能がない証拠ではありません。**長い間、蛇口をひねってこなかった**という証拠にすぎないのです。"],
 e:"濁った水を恥じることはありません。恥ずべきは、蛇口を閉めてしまうことです。"},
{t:"行き先を言わない乗客",
 p:["タクシーに乗り込んだ客が、運転手にこう言いました。「どこでもいいから、良いところへやってくれ」",
    "運転手は困ってしまいます。腕がどれほど確かでも、車がどれほど立派でも、**行き先が分からなければ、アクセルを踏むことができない**のです。",
    "馬鹿げた話だと思われるでしょう。しかし、多くの人が、自分の人生に対して、まったく同じ注文をしています。「もっと良くなりたい」「いつか成功したい」と。",
    "あなたの能力は、優秀な運転手です。**はっきりと行き先を告げられる**のを、今も待っています。"],
 e:"「どこへ」「いつまでに」。まず、それを口に出しましょう。"},
{t:"十年後の庭を見る職人",
 p:["二人の植木職人が、同じ若木の前に立ちました。",
    "一人目は、伸びすぎた枝を見て、言われたとおりに切りそろえました。仕事は早く、今日の庭はきれいになりました。",
    "二人目は、しばらく木を眺めてから、はさみを入れました。彼が見ていたのは、今日の枝ではなく、**十年後のその木の姿**でした。どの枝を残せば、やがて見事な枝ぶりになるかを考えていたのです。",
    "十年たって、人が足を止めるのは、二人目の職人が手がけた庭です。",
    "あなたは今日の仕事を、**今日の見た目のために**していますか。それとも、**十年後の姿のために**していますか。"],
 e:"はさみを入れる前に、十年後を見るのです。"},
{t:"目覚まし時計は、あなたを起こさない",
 p:["目覚まし時計を三つ並べて寝る人がいます。それでも、寝坊をします。",
    "時計にできるのは、音を鳴らすことだけです。布団をはねのけ、床に足を下ろすのは、**時計ではなく、あなた自身**です。",
    "良い本も、良い上司も、良い研修も、目覚まし時計と同じです。どれほど大きな音で鳴っても、あなたの代わりに起き上がってはくれません。",
    "「誰かが自分をやる気にさせてくれるはずだ」と待っている人は、鳴り続けるベルの中で眠り続けているのです。**モティベーションとは、内側から起き上がる力**のことです。"],
 e:"ベルは、もう十分に鳴りました。起き上がるのは、あなたです。"},
{t:"エレベーターを待つ人",
 p:["三階へ行くために、エレベーターの前で五分間待っている人がいます。すぐ横に階段があるのに、です。",
    "「どうせなら楽に、一気に上がりたい」という気持ちは、誰にでもあります。しかし、人生には、**目標の階まで運んでくれるエレベーターは設置されていません**。",
    "あるのは階段だけです。そして階段は、一度に一段しか上がれないようにできています。",
    "一段は、わずかな高さです。けれども、待っている人が一歩も上がらない間に、**上り始めた人は、もう踊り場に立っている**のです。"],
 e:"今日の一段を上がりましょう。扉が開くのを待つのは、やめるのです。"},
{t:"凧は、向かい風で揚がる",
 p:["子どもが凧を揚げるとき、風に背を向けて走ったりはしません。風に向かって走ります。",
    "凧は、**向かい風を受けたときにだけ、空へ昇っていく**からです。追い風の中では、凧は地面を引きずられるだけです。",
    "あなたが今、強い風を正面から受けているとしたら、それは落ちる前触れではありません。昇るための条件が、整っているということです。",
    "ただし、ひとつだけ必要なものがあります。糸です。**目標という糸**がしっかりと結ばれていない凧は、同じ風に吹き飛ばされてしまいます。"],
 e:"風を嘆く前に、糸を確かめなさい。"},
{t:"引き出しの奥の鍵",
 p:["引き出しの奥から、古い鍵が出てきました。どこの鍵だったのか、もう思い出せません。錆びついて、鍵穴にも入りそうにありません。",
    "毎日使われている鍵は、何十年たっても光っています。錆びるのは、**使われなかった鍵**だけです。",
    "人の能力も同じです。「自分には才能がない」と言う人の多くは、才能がないのではありません。**しまい込んだまま、使っていない**のです。",
    "若いころ得意だったこと。人から褒められたこと。いつかやろうと思っていたこと。それらは今、引き出しのどのあたりにありますか。"],
 e:"能力は、使うことでしか磨かれません。今日、ひとつ取り出しましょう。"},
{t:"コップの水の、その先",
 p:["コップに水が半分入っています。「もう半分しかない」と言う人と、「まだ半分ある」と言う人がいる。よく知られた話です。",
    "しかし、この話には続きがあります。三人目の人は、コップを眺めて論じたりはしませんでした。**立ち上がって、水差しを取りに行った**のです。",
    "悲観するか、楽観するか。それは確かに大切な違いです。けれども、どちらの人のコップも、眺めているかぎり、水は一滴も増えません。",
    "現状をどう見るかの次に来るのは、**現状をどう変えるか**です。"],
 e:"見方を変えたら、次は立ち上がりましょう。"},
{t:"信号が全部、青になる日",
 p:["家から会社まで、信号が二十あるとします。",
    "「二十の信号がすべて青になったら出発しよう」と考える人は、いません。そんな日は、永久に来ないからです。誰もが、まず家を出ます。そして、赤なら止まり、青になれば進み、結局は会社に着きます。",
    "ところが、人生の大事な計画になると、多くの人が、**すべての信号が青になるのを待ちはじめます**。資金がそろったら。時間ができたら。景気が良くなったら。子どもが大きくなったら。",
    "**条件が完全にそろう日は、来ません**。赤信号は、走り出した人だけが、ひとつずつ越えていけるものなのです。"],
 e:"最初の信号が青なら、それで十分です。出発しましょう。"},
{t:"靴屋は、まず足を測る",
 p:["腕の良い靴屋は、客が店に入ってきても、すぐに靴を勧めたりはしません。まず椅子をすすめ、足を測り、どんな場面で履くのかを尋ねます。",
    "下手な靴屋は、自分が売りたい靴を次々に並べ、その良さを熱心に語ります。そして、客が何も買わずに出て行くと、「今日の客は見る目がない」と言うのです。",
    "人を動かしたいなら、**語る前に、測ること**です。相手が何を望み、何に困り、どこへ歩いて行きたいのか。それを知らずに差し出した靴は、どんなに上等でも、相手の足には合いません。"],
 e:"あなたは今日、誰かの足を測りましたか。"},
{t:"充電器につながない電話",
 p:["最新型の携帯電話を持っている人がいました。機能は申し分ありません。ところがその人は、忙しさを理由に、一度も充電をしませんでした。",
    "どうなったかは、お分かりでしょう。どれほど高性能でも、**電池が空になれば、ただの板**です。",
    "学ぶこと。体を休めること。静かに考える時間を持つこと。これらを「忙しいから」と後回しにしている人は、充電をせずに電話を使い続けている人と同じです。",
    "充電の時間は、仕事を止めている時間ではありません。**明日も働けるようにしている時間**なのです。"],
 e:"今日のうちに、あなた自身を充電器につなぎましょう。"},
{t:"昨日の新聞",
 p:["毎朝、昨日の新聞を広げて読む人がいたら、あなたはどう思うでしょうか。",
    "昨日の天気予報では、今日の傘は決められません。昨日の株価では、今日の取引はできません。",
    "ところが、**過ぎた失敗を毎朝読み返している人**は、驚くほど大勢います。あのとき断られた。あのとき間違えた。あのとき笑われた。同じ紙面を、何年も、何年も読み続けているのです。",
    "失敗から学ぶことは必要です。しかし、それは一度読めば足ります。読み終えた新聞は、たたんで置くものです。",
    "今朝、あなたの玄関には、**まだ誰も読んでいない今日**が届いています。"],
 e:"昨日の新聞をたたみましょう。今日の一面を書くのは、あなたです。"},
{t:"一番星を見つける人",
 p:["夕暮れどき、誰よりも早く一番星を見つける子どもがいます。その子の目が特別に良いわけではありません。",
    "ほかの子が足もとを見て歩いているあいだ、**その子だけが、空を見上げていた**のです。",
    "「自分にはチャンスが来ない」と言う人がいます。けれども、星は、すべての人の頭の上に同じように出ています。違いは、星の数ではなく、**顔を上げた回数**です。",
    "チャンスは、探している人の目にしか映りません。そして、見上げる習慣のある人だけが、まだ空が明るいうちに、最初の光に気づくのです。"],
 e:"顔を上げなさい。星は、もう出ています。"},
{t:"リュックサックの中身",
 p:["山道で、ひどく苦しそうに登っている人がいました。見かねた仲間が、リュックサックを開けさせてみると、中から大きな石がいくつも出てきました。",
    "石には、こう書いてありました。「あの人にどう思われるだろう」「昔、あんな失敗をした」「どうせ自分には無理だ」。",
    "山が険しかったのではありません。**登るのに必要のないもの**を、何年も背負って歩いていたのです。",
    "あなたのリュックサックには、水と食料と地図のほかに、何が入っていますか。**石を下ろすのに、誰の許可もいりません**。"],
 e:"一度、荷物を開けてみましょう。足どりは、驚くほど軽くなります。"},
{t:"水泳の本を十冊読んだ男",
 p:["泳げるようになりたいと願った男が、水泳の本を十冊読みました。腕の動かし方、息つぎの間合い、水の抵抗の理屈まで、すっかり暗記しました。",
    "そして初めてプールに入り、沈みました。",
    "男に足りなかったのは、知識ではありません。**水を飲んだ回数**です。",
    "知ることは、大切な第一歩です。しかし、知っているだけでは、体は一センチも前に進みません。**知識は、行動に移されたときに初めて、力に変わる**のです。",
    "あなたの本棚には、読んだだけで、まだ水に入っていない本が、何冊ありますか。"],
 e:"十一冊目を開く前に、水に入りましょう。"},
{t:"締め切りのない宿題",
 p:["先生が言いました。「この宿題は、いつ出してもかまいません」",
    "その宿題を提出した生徒は、ほとんどいませんでした。怠け者ばかりだったわけではありません。「いつでもいい」ことは、**「今日でなくていい」こと**であり、今日でなくていいことは、明日もまた、今日でなくていいからです。",
    "「いつか店を持ちたい」「いつか資格を取りたい」「いつか親を旅行に連れて行きたい」。**日付のない目標は、目標ではなく、願いごと**です。",
    "願いごとに日付を書き入れた瞬間、それは約束に変わります。あなた自身との、約束に。"],
 e:"「いつか」を消して、日付を書き入れなさい。"},
{t:"雑草は、種をまかなくても生える",
 p:["畑を一か月放っておくと、どうなるでしょうか。何もまいていないのに、一面、雑草だらけになります。",
    "野菜は違います。種をまき、水をやり、手をかけなければ、ひとつも育ちません。",
    "人の心も、同じ畑です。不安、不満、言い訳、あきらめ。こうした**消極的な考えは、放っておくだけで勝手に生えてきます**。一方、希望や自信や感謝は、**意識して種をまいた人の心にしか育ちません**。",
    "「何も考えていないのに、気がつくと暗い気持ちになっている」のは、当然のことなのです。"],
 e:"今日、あなたの畑に、良い種をひとつまきましょう。"},
{t:"ほめ言葉の貯金箱",
 p:["ある工場長は、朝、ポケットに十円玉を五枚入れて出勤しました。部下の良いところを見つけて声をかけるたびに、一枚を反対のポケットに移します。五枚すべてが移るまで、帰らないと決めていました。",
    "最初の一週間は、苦労しました。**欠点は探さなくても目に入るのに、長所は探さなければ見えなかった**からです。",
    "三か月たつころ、工場の空気が変わりました。部下が変わったのではありません。**工場長の目が変わった**のです。そして、認められた人は、認められた点を、さらに伸ばそうとするものです。"],
 e:"今日、あなたのポケットから、硬貨は何枚移るでしょうか。"},
{t:"自転車の、最初のひとこぎ",
 p:["自転車で一番力がいるのは、いつでしょうか。坂道でも、向かい風でもありません。**止まった状態からの、最初のひとこぎ**です。",
    "ペダルは重く、車体はふらつき、少しも進まないように感じます。しかし、三こぎ、四こぎと続けるうちに、ふっと軽くなる瞬間が来ます。あとは、同じ力で、ずっと遠くまで走れるのです。",
    "新しいことを始めた人の多くは、この**一番重いところでやめてしまいます**。そして「自分には向いていなかった」と言うのです。",
    "向いていなかったのではありません。まだ、勢いがついていなかっただけです。"],
 e:"重いのは、最初だけです。もうひとこぎ、踏み込みましょう。"},
{t:"鏡は、先に笑わない",
 p:["鏡の前に立って、「そちらが先に笑ったら、こちらも笑おう」と待っている人がいたとします。その人は、一日じゅう、不機嫌な顔を見つめ続けることになるでしょう。",
    "職場も、家庭も、お客様も、大きな鏡です。あなたが差し出したものを、そのまま映して返してきます。**無関心には無関心が、誠意には誠意が**返ってくるのです。",
    "「まわりが冷たい」「誰も協力してくれない」と感じたときは、鏡が曇っているのではありません。",
    "**先に笑うのは、いつでも、鏡の前に立っている人のほう**です。"],
 e:"待つのをやめて、あなたから始めましょう。"},
{t:"乗り遅れた電車",
 p:["発車のベルが鳴り終わり、目の前でドアが閉まりました。",
    "ある人は、遠ざかる電車をにらみ、時計を恨み、道で話しかけてきた知人を恨みます。そうしている間に、次の電車がホームに入ってきて、その人はそれにも気づかずに、また乗りそこねます。",
    "別の人は、ひとつ息をつくと、手帳を開き、到着が遅れることを相手に知らせ、次の電車の時刻を確かめます。",
    "逃した機会を悔やむのは、自然なことです。しかし、**行ってしまった電車は、いくら見送っても戻ってきません**。あなたが見るべきなのは、**反対側から近づいてくる、次の電車**です。"],
 e:"後ろを見送るのをやめて、次の時刻を確かめましょう。"},
{t:"名札のない椅子",
 p:["広い会場に、椅子がたくさん並んでいます。どの椅子にも、名札はついていません。",
    "ある人は、入口に立ったまま、誰かが「こちらへどうぞ」と案内してくれるのを待っています。別の人は、会釈をしながら前へ進み、一番前の列に腰を下ろします。",
    "世の中のほとんどの機会は、この椅子と同じです。**あなたの名前は書かれていません。しかし、他の誰の名前も書かれていない**のです。",
    "「自分などが座ってよいのだろうか」とためらう人の席は、いつも、ためらわなかった人のものになります。"],
 e:"前へ進んで、座りなさい。その椅子は、空いています。"},
{t:"鉛筆には、消しゴムがついている",
 p:["鉛筆のうしろには、小さな消しゴムがついています。",
    "これを考えた人は、よく分かっていたのです。**人は必ず書き間違える**ということを。そして、**間違えたら直せばよい**ということを。",
    "ところが、間違えることを恐れるあまり、一文字も書き出せない人がいます。白い紙は、たしかに一つの間違いもありません。しかし、そこには、何の物語も書かれていないのです。",
    "失敗を避けるいちばん確実な方法は、何もしないことです。そして、**何もしないことこそ、取り返しのつかない、ただひとつの失敗**です。"],
 e:"まず書きなさい。直すのは、そのあとでよいのです。"},
{t:"山頂の写真には、登り道が写らない",
 p:["山頂で撮った写真には、青い空と、晴れやかな笑顔が写っています。",
    "写っていないものがあります。夜明け前の出発。汗にぬれたシャツ。何度も引き返そうかと迷った、あの急な坂です。",
    "わたしたちは、成功した人の**山頂の写真だけ**を見て、「あの人は運が良い」「自分とは違う」と言いがちです。そして、自分の足もとの険しい道を見て、「こんなに苦しいのは、道を間違えているからだ」と考えてしまいます。",
    "そうではありません。**苦しい登り道こそ、山頂へ続く道のふつうの姿**なのです。"],
 e:"あなたが今いる坂は、写真に写らないだけで、誰もが通った道です。"},
{t:"補助輪を外す日",
 p:["補助輪のついた自転車は、けっして倒れません。安心で、快適です。",
    "けれども、補助輪をつけたままでは、速く走ることも、遠くへ行くことも、思いきり曲がることもできません。**安全と引きかえに、自由を置いてきている**のです。",
    "外した日のことを、覚えていますか。ふらつき、転び、ひざをすりむきました。それでも、もう一度つけてくれと言った子どもは、ほとんどいなかったはずです。**自分の力で走る喜び**を、知ってしまったからです。",
    "慣れた仕事、慣れたやり方、慣れた顔ぶれ。あなたの補助輪は、どこについていますか。"],
 e:"ひざをすりむく覚悟が、あなたを遠くへ連れて行きます。"},
{t:"朝いちばんの十五分",
 p:["大きな船も、舵はごく小さなものです。その小さな舵を、港を出るときにどちらへ切るかで、船の着く岸が決まります。",
    "一日の舵は、**朝いちばんの十五分**です。",
    "目が覚めてすぐ、昨日の不満を思い出し、あわただしく家を飛び出す人。同じ十五分で、今日なしとげたいことを三つ書き出し、落ち着いて家を出る人。二人の一日は、同じ二十四時間でも、まるで別の岸に着きます。",
    "一日の差は、わずかです。しかし、**そのわずかな角度の違いが、一年たてば、まったく違う海**へ船を運んでいるのです。"],

{t:"向こう岸の渡し守",
